name: Build PKGs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-pkgs:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install system dependencies & setup build system
        run: |
          DEPS=$(bash -c 'source aur/PKGBUILD && echo "${depends[@]} ${makedepends[@]}"')
          pacman -Syu --noconfirm --needed base-devel git nodejs npm \
          libxcrypt-compat ruby rubygems dpkg rpm $DEPS
          ldconfig
          gem install --no-document fpm
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: install dependencies
        run: su builder -c "npm ci --no-audit --no-fund"

      - name: Build Deb/RPM
        run: |
          su builder -c "npm run dist"

      - name: build ArchPKG
        run: su builder -c 'npm run build-arch'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            aur/*.tar.gz
            aur/*.pkg.tar.zst
            release/*.deb
            release/*.rpm
            release/*.AppImage